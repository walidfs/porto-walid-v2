      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&display=swap"
      rel="stylesheet"
    />

    <!-- Apply saved theme & language before first paint (prevents flash) -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("wfs-theme");
          if (!theme) {
            theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          if (theme === "dark") document.documentElement.classList.add("dark");
          var lang = new URLSearchParams(window.location.search).get("lang") || localStorage.getItem("wfs-lang");
          if (lang === "id" || lang === "en") document.documentElement.lang = lang;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>Please enable JavaScript to view this portfolio.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
